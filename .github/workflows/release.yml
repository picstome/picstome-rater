name: release

on:
  push:
    tags:
      - "[0-9]+.[0-9]+*"
      - "v[0-9]+.[0-9]+*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          # the check job only parses files; skip the ~100MB electron download
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
      - name: Sanity check sources
        run: |
          node --check main.js
          node --check preload.js
          node --check renderer.js
          node -e "JSON.parse(require('fs').readFileSync('package.json','utf8'))"

  build:
    needs: check
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Unsigned builds: the app is not notarized, no Apple Developer ID.
      - name: Build and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder --mac --win --arm64 --x64 --publish always

      - name: Release assets
        run: ls -lh dist
