name: release

on:
  push:
    tags:
      - "[0-9]+.[0-9]+*"
      - "v[0-9]+.[0-9]+*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing tag to build and publish (leave empty to only build)"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          # the check job only parses files; skip the ~100MB electron download
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
      - name: Sanity check sources
        run: |
          node --check main.js
          node --check preload.js
          node --check renderer.js
          node -e "JSON.parse(require('fs').readFileSync('package.json','utf8'))"

  # Builds run on their own OS and never publish. A single release job uploads
  # everything afterwards, so macOS and Windows can't race each other into a
  # half-populated GitHub release.
  build-mac:
    needs: check
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Unsigned builds: the app is not notarized, no Apple Developer ID.
      - name: Build macOS
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder --mac --arm64 --x64 --publish never

      - name: Collect assets
        shell: bash
        run: |
          mkdir -p release-assets
          find dist -maxdepth 1 \( -name '*.dmg' -o -name '*.dmg.blockmap' -o -name 'latest-mac.yml' \) -exec cp {} release-assets/ \;
          ls -lh release-assets

      - uses: actions/upload-artifact@v4
        with:
          name: mac-assets
          path: release-assets/*
          if-no-files-found: error

  build-win:
    needs: check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Build Windows
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder --win --x64 --arm64 --publish never

      # NSIS leaves a temporary "__uninstaller.exe" behind; never ship it.
      - name: Collect assets
        shell: bash
        run: |
          mkdir -p release-assets
          find dist -maxdepth 1 -name '*.exe' ! -name '*__uninstaller*' -exec cp {} release-assets/ \;
          find dist -maxdepth 1 \( -name '*.exe.blockmap' -o -name 'latest.yml' \) -exec cp {} release-assets/ \;
          ls -lh release-assets

      - uses: actions/upload-artifact@v4
        with:
          name: win-assets
          path: release-assets/*
          if-no-files-found: error

  publish:
    needs: [build-mac, build-win]
    if: startsWith(github.ref, 'refs/tags/') || inputs.release_tag != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: List assets
        run: ls -lh release-assets

      # Uploads to the release of the pushed tag (or the tag given in the manual
      # run), creating it if needed. Never rename assets: auto-update matches the
      # names in the .yml files.
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          name: ${{ inputs.release_tag || github.ref_name }}
          draft: false
          prerelease: false
          make_latest: true
          files: release-assets/*
          fail_on_unmatched_files: true
          generate_release_notes: true
