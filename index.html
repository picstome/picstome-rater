<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta
            http-equiv="Content-Security-Policy"
            content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'none';"
        />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Picstome Rater</title>
        <link rel="stylesheet" href="./styles.css" />
    </head>
    <body>
        <div class="app-shell">
            <div class="card">
                <div class="brand">
                    <img
                        class="brand-logo"
                        src="./assets/picstome-logo-transparent-2.2.png"
                        alt="Picstome"
                    />
                </div>

                <div class="header">
                    <div class="subtitle" id="subtitle">…</div>
                </div>

                <div class="section">
                    <label class="title-label" id="folderLabel"
                        >Photos folder</label
                    >
                    <div class="row">
                        <div class="path-box empty" id="pathBox">
                            No folder selected
                        </div>
                        <button
                            class="secondary"
                            id="btnChooseFolder"
                            type="button"
                        >
                            Change...
                        </button>
                    </div>
                </div>

                <div class="info-row hidden" id="infoRow">
                    <div class="info-chip">
                        <span class="chip-label">Photos</span>
                        <strong id="fileCount">0</strong>
                        <span id="photosLabel">photos</span>
                    </div>

                    <div class="info-chip info-chip-rating">
                        <span class="chip-label" id="ratingLabel">Rating</span>

                        <div
                            class="star-picker"
                            id="starPicker"
                            aria-label="Rating selector"
                        >
                            <button
                                type="button"
                                class="star-btn"
                                data-rating="1"
                                aria-label="1 star"
                            >
                                ★
                            </button>
                            <button
                                type="button"
                                class="star-btn"
                                data-rating="2"
                                aria-label="2 stars"
                            >
                                ★
                            </button>
                            <button
                                type="button"
                                class="star-btn"
                                data-rating="3"
                                aria-label="3 stars"
                            >
                                ★
                            </button>
                            <button
                                type="button"
                                class="star-btn"
                                data-rating="4"
                                aria-label="4 stars"
                            >
                                ★
                            </button>
                            <button
                                type="button"
                                class="star-btn"
                                data-rating="5"
                                aria-label="5 stars"
                            >
                                ★
                            </button>
                        </div>

                        <strong id="ratingVal">1</strong>
                    </div>
                </div>

                <div class="btn-row">
                    <button id="btnRate" type="button" disabled>
                        Apply rating
                    </button>
                </div>

                <div class="spinner hidden" id="spinner">Applying rating…</div>

                <div class="results hidden" id="results">
                    <div class="result-summary" id="resultSummary"></div>
                    <div class="detail-list" id="detailList"></div>
                </div>

                <div class="update-banner hidden" id="updateBanner">
                    <span id="updateMsg"></span>
                    <button
                        class="update-btn hidden"
                        id="btnUpdate"
                        type="button"
                    >
                        Restart &amp; Update
                    </button>
                </div>
            </div>
        </div>

        <script src="./renderer.js"></script>
    </body>
</html>
